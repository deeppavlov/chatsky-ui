name: check frontend

on:
  push:
    branches:
    - dev
    - master
  pull_request:
    branches:
    - dev

jobs:
  check_frontend_codestyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        run: npm install -g bun

      - name: Install dependencies
        run: bun install
        working-directory: frontend

      - name: Run prettier codestyle
        run: bun run check:lint
        working-directory: frontend
